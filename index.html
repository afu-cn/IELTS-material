<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IELTS 单词刷题</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
    --brand:#3b6ef5; --brand-dark:#2b53c8; --ok:#16a34a; --bad:#dc2626;
    --line:#e5e7eb; --shadow:0 8px 30px rgba(30,41,59,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
  h1{font-size:22px;margin:0}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  nav{display:flex;gap:8px;background:var(--card);padding:6px;border-radius:12px;box-shadow:var(--shadow)}
  nav button{flex:1;border:0;background:transparent;padding:10px 8px;border-radius:9px;font-size:14px;color:var(--muted);cursor:pointer}
  nav button.active{background:var(--brand);color:#fff;font-weight:600}
  .panel{display:none}
  .panel.active{display:block}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:22px;margin-top:16px}
  .controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button.btn{border:0;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;background:var(--brand);color:#fff}
  button.btn:hover{background:var(--brand-dark)}
  button.btn.ghost{background:#eef1f8;color:var(--ink)}
  button.btn.danger{background:var(--bad)}
  button.btn:disabled{opacity:.5;cursor:not-allowed}
  .word{font-size:34px;font-weight:700;word-break:break-word}
  .pron{color:var(--muted);margin-top:6px;font-size:16px}
  .speak{margin-top:8px;font-size:13px;color:var(--brand);cursor:pointer;background:none;border:0;padding:0}
  .trans{margin-top:18px;font-size:19px;line-height:1.6;white-space:pre-wrap}
  .mask{filter:blur(7px);cursor:pointer;user-select:none}
  .hint{color:var(--muted);font-size:13px;margin-top:8px}
  .opts{display:grid;gap:10px;margin-top:16px}
  .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;cursor:pointer;line-height:1.5}
  .opt:hover{border-color:var(--brand)}
  .opt.correct{background:#ecfdf5;border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:#fef2f2;border-color:var(--bad);color:var(--bad)}
  .opt:disabled{cursor:default;opacity:.9}
  .bar{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;margin-top:12px}
  .result{margin-top:14px;font-size:15px;line-height:1.6}
  .correct-ans{color:var(--ok);font-weight:600}
  .wrong-ans{color:var(--bad);font-weight:600}
  .stat{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
  .stat div{flex:1;min-width:110px;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
  th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:28px 12px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  select,input[type=number]{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;background:#fff}
  @media(max-width:520px){.word{font-size:27px}.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>IELTS 单词刷题</h1>
      <div class="sub">词库共 2123 条 · 可作答 1770 条</div>
    </div>
  </header>

  <nav>
    <button data-tab="flash" class="active">单词卡</button>
    <button data-tab="quiz">刷题</button>
    <button data-tab="wrong">错题本</button>
  </nav>

  <!-- 单词卡 -->
  <section id="flash" class="panel active">
    <div class="card">
      <div class="row">
        <span id="flashPos" style="color:var(--muted);font-size:13px"></span>
        <span style="flex:1"></span>
        <select id="flashOrder" style="font-size:13px">
          <option value="seq">顺序</option>
          <option value="rand">随机</option>
        </select>
      </div>
      <div class="word" id="flashWord"></div>
      <div class="pron" id="flashPron"></div>
      <button class="speak" id="flashSpeak">🔊 朗读</button>
      <div class="trans mask" id="flashTrans">—</div>
      <div class="hint">点击释义区域显示 / 隐藏释义</div>
      <div class="controls">
        <button class="btn ghost" id="prevBtn">上一个</button>
        <button class="btn ghost" id="nextBtn">下一个</button>
        <button class="btn ghost" id="shuffleBtn">随机一个</button>
      </div>
    </div>
  </section>

  <!-- 刷题 -->
  <section id="quiz" class="panel">
    <div class="card">
      <div class="row">
        <select id="direction">
          <option value="en2cn">看英文选中文</option>
          <option value="cn2en">看中文选英文</option>
        </select>
        <select id="count">
          <option value="10">10 题</option>
          <option value="20">20 题</option>
          <option value="30">30 题</option>
        </select>
        <button class="btn" id="startBtn">开始刷题</button>
      </div>
      <div class="bar" id="quizBar" style="display:none">
        <span id="quizPos"></span>
        <span id="quizScore"></span>
      </div>
      <div id="quizBody"></div>
      <div class="result" id="quizResult" style="display:none"></div>
    </div>
  </section>

  <!-- 错题本 -->
  <section id="wrong" class="panel">
    <div class="card">
      <div class="row" style="margin-bottom:8px">
        <b style="font-size:16px">错题本</b>
        <span style="flex:1"></span>
        <button class="btn ghost" id="clearWrong">清空错题本</button>
      </div>
      <div id="wrongList"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

const $ = (id) => document.getElementById(id);
let toastTimer;
function toast(msg){
  const el = $("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 1800);
}

function speak(text){
  if(!("speechSynthesis" in window)){ toast("当前浏览器不支持朗读"); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; u.rate = 0.85;
  window.speechSynthesis.speak(u);
}

// 错题本 storage
const WB_KEY = "ielts_quiz_wrong_book_v1";
function getWrong(){ try{ return JSON.parse(localStorage.getItem(WB_KEY)||"{}"); }catch(e){ return {}; } }
function saveWrong(w){ localStorage.setItem(WB_KEY, JSON.stringify(w)); }
function markWrong(item){
  const w = getWrong();
  const key = item.word;
  w[key] = { word:item.word, pron:item.pron||"", trans:item.trans||"", count:(w[key]?.count||0)+1, at:Date.now() };
  saveWrong(w);
}
function removeWrong(word){
  const w = getWrong(); delete w[word]; saveWrong(w);
}
function renderWrong(){
  const w = getWrong();
  const keys = Object.keys(w).sort((a,b)=>w[b].at-w[a].at);
  const list = $("wrongList");
  if(keys.length===0){
    list.innerHTML = '<div class="empty">暂无错题，继续加油 💪</div>';
    return;
  }
  let html = '<table><tr><th>单词 / 短语</th><th>发音</th><th>释义</th><th>错误</th><th></th></tr>';
  for(const k of keys){
    const it = w[k];
    html += '<tr><td><b>'+esc(it.word)+'</b></td><td>'+esc(it.pron)+'</td><td>'+esc(it.trans)+'</td><td>'+it.count+' 次</td><td><button class="btn ghost" data-say="'+esc(it.word)+'" style="padding:5px 9px;font-size:12px">🔊</button> <button class="btn ghost" data-remove="'+esc(it.word)+'" style="padding:5px 9px;font-size:12px">移除</button></td></tr>';
  }
  html += '</table>';
  list.innerHTML = html;
  list.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.say)));
  list.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>{ removeWrong(b.dataset.remove); renderWrong(); toast("已移除"); }));
}
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// 单词卡
let flashIdx = 0;
const flashOrder = { seq:()=>flashIdx, rand:()=>Math.floor(Math.random()*VOCAB.length) };
function renderFlash(){
  const mode = $("flashOrder").value;
  const it = VOCAB[mode==="rand" ? flashOrder.rand() : flashIdx % VOCAB.length];
  $("flashPos").textContent = ((mode==="rand"?flashIdx:flashIdx)%VOCAB.length+1)+" / "+VOCAB.length;
  $("flashWord").textContent = it.word;
  $("flashPron").textContent = it.pron||"";
  const t = $("flashTrans");
  t.textContent = it.trans||"（暂无释义）";
  t.classList.add("mask");
}
$("flashTrans").addEventListener("click",()=>$("flashTrans").classList.toggle("mask"));
$("flashSpeak").addEventListener("click",()=>speak($("flashWord").textContent));
$("prevBtn").addEventListener("click",()=>{ flashIdx = (flashIdx-1+VOCAB.length)%VOCAB.length; renderFlash(); });
$("nextBtn").addEventListener("click",()=>{ flashIdx = (flashIdx+1)%VOCAB.length; renderFlash(); });
$("shuffleBtn").addEventListener("click",()=>{ flashIdx = Math.floor(Math.random()*VOCAB.length); renderFlash(); });
$("flashOrder").addEventListener("change",renderFlash);

// 刷题
let quizState = null;
function startQuiz(){
  const n = Math.min(parseInt($("count").value,10)||10, QUIZ.length);
  const dir = $("direction").value;
  const pool = shuffle(QUIZ).slice(0,n);
  quizState = { dir, items: pool, i:0, correct:0, answered:false };
  $("quizBar").style.display = "flex";
  $("quizResult").style.display = "none";
  renderQuestion();
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderQuestion(){
  if(!quizState){ $("quizBody").innerHTML='<div class="empty">点击「开始刷题」开始练习</div>'; return; }
  const s = quizState;
  if(s.i >= s.items.length){
    $("quizBar").style.display = "none";
    $("quizBody").innerHTML = "";
    $("quizResult").style.display = "block";
    $("quizResult").innerHTML = '<div class="correct-ans">本轮完成！</div>答对 '+s.correct+' / '+s.items.length+' 题，正确率 '+Math.round(s.correct/s.items.length*100)+'%。';
    return;
  }
  s.answered = false;
  const item = s.items[s.i];
  $("quizPos").textContent = "第 "+(s.i+1)+" / "+s.items.length+" 题";
  $("quizScore").textContent = "已答对 "+s.correct;

  const isEn = s.dir==="en2cn";
  const promptText = isEn ? item.word : item.trans;
  const answerText = isEn ? item.trans : item.word;

  // distractors
  const others = QUIZ.filter(x=>x!==item && (isEn ? x.trans : x.word) !== answerText);
  const dist = shuffle(others).slice(0,3);
  const opts = shuffle([answerText, ...dist.map(x=> isEn ? x.trans : x.word)]);

  let html = '<div class="word" style="font-size:26px">'+esc(promptText)+'</div>';
  if(isEn && item.pron) html += '<div class="pron">'+esc(item.pron)+'</div><button class="speak" id="qSpeak">🔊 朗读</button>';
  html += '<div class="hint">'+(isEn?"选择正确的中文释义":"选择正确的英文单词")+'</div><div class="opts">';
  opts.forEach((optText,idx)=>{
    html += '<button class="opt" data-idx="'+idx+'">'+esc(optText)+'</button>';
  });
  html += '</div>';
  $("quizBody").innerHTML = html;
  if(isEn){ const sp=$("qSpeak"); if(sp) sp.addEventListener("click",()=>speak(item.word)); }
  $("quizBody").querySelectorAll(".opt").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(s.answered) return;
      s.answered = true;
      const chosen = btn.textContent;
      const correct = chosen === answerText;
      const btns = $("quizBody").querySelectorAll(".opt");
      btns.forEach(b=>{
        b.disabled = true;
        if(b.textContent===answerText) b.classList.add("correct");
      });
      if(correct){ s.correct++; }
      else { btn.classList.add("wrong"); markWrong(item); }
      $("quizScore").textContent = "已答对 "+s.correct;
      const res = document.createElement("div");
      res.className = "result";
      res.innerHTML = correct
        ? '<span class="correct-ans">回答正确 ✓</span>'
        : '<span class="wrong-ans">回答错误 ✗</span> 正确答案：<span class="correct-ans">'+esc(answerText)+'</span>';
      $("quizBody").appendChild(res);
    });
  });
}
$("startBtn").addEventListener("click",startQuiz);

// 答完一题后自动进入下一题
document.addEventListener("click",(e)=>{
  const s = quizState;
  if(!s || !s.answered) return;
  if(e.target.closest("#quizBody .opt")){
    setTimeout(()=>{ s.i++; renderQuestion(); }, 900);
  }
});

$("clearWrong").addEventListener("click",()=>{ if(confirm("确定清空错题本？")){ saveWrong({}); renderWrong(); toast("已清空"); } });

renderFlash();
$("quizBody").innerHTML='<div class="empty">点击「开始刷题」开始练习</div>';
</script>
